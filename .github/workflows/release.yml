name: Release

# Builds a Linux binary whenever a GitHub release is published and attaches
# it to the release. The release tag (e.g. `v1.2.3`) is stamped into
# Cargo.toml just before building, so `quasseltui --version` and the
# client version sent to the core both carry it.
#
# Release flow: `git tag vX.Y.Z && git push --tags`, then create a GitHub
# release for that tag. No manual version bump in the tree is needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 1.2.3). Leave blank to build the committed version."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to attach assets to the GitHub release
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            raw="$TAG_NAME"
          else
            raw="$INPUT_VERSION"
          fi
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version:-<none — keeping committed version>}"

      - name: Stamp version into Cargo.toml
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          grep -E '^version = ' Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="quasseltui-${VERSION:-dev}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/quasseltui" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: quasseltui-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" "${{ steps.package.outputs.archive }}" --clobber
